name: Deploy

# push 到 main 自动部署到本机（self-hosted runner 与服务同机，docker 部署）
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}   # 支持在 GitHub 页面手动触发

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # 不清理未跟踪文件，保住 runner 工作区里的本地状态
          clean: false

      - name: Go test
        run: go test ./... -count=1

      - name: Write config.yaml
        run: |
          # 生产配置直接写在 workflow 里（不含任何密钥），改配置改这里。
          # 密钥（DB 密码 / R2 凭据 / CF API Token）由下面生成的 .env.docker 注入，
          # 见 internal/config/config.go 的 applyEnv。
          cat > config.yaml <<'CONFIG'
          # imgbed 运行配置（不含任何密钥，密钥全部来自 ./.env.docker）
          server:
            addr: ":18080"
            allowed_origins:
              - "https://img.taojun.top"
              # CI/CD 控制台的「监控」视图由浏览器直连健康接口，需放行其来源
              - "https://cicd.taojun.top"

          ucenter:
            base_url: "https://ucenter.june-t.top"
            app: "imgbed"
            jwks_ttl: "1h"

          r2:
            bucket: "image"
            prefix: ""
            public_base: "https://img.june-t.top"
            private_prefix: "private/"
            # 查真实占用用的 Cloudflare API Token，由 IMGBED_R2_CF_API_TOKEN 注入
            cf_api_token: ""
            # 存储配额（字节），进度条的分母。默认 10 GiB = R2 免费档。
            quota_bytes: 10737418240

          db:
            host: "10.0.0.226"
            port: 3306
            name: "imgbed"
            user: "junet"
            # HeatWave 内部域名是自签证书，不能用 true（会强制校验证书而失败）
            tls_mode: "preferred"
            max_open_conns: 16
            max_idle_conns: 8
            conn_max_lifetime_sec: 180

          limits:
            max_upload_mb: 20
            max_batch: 50
            folder_migrate_warn: 5000
            trash_retain_days: 7
          CONFIG

      - name: Write .env.docker from local single source
        run: |
          # 密钥单一来源是宿主机 /home/ubuntu/server/secrets/imgbed/.env.sh
          # （shell 格式，内部 source /home/ubuntu/db/.env）。
          # docker-compose.yml 里这个 env_file 配了 format: raw，所以密码里的
          # `$` 不会被 compose 当插值吃掉，不需要像 WordRush 那样转义 $$。
          cp /home/ubuntu/server/secrets/imgbed/.env.sh .env.sh
          ./gen-docker-env.sh
          chmod 600 .env.docker

      - name: Backup current image
        run: sudo docker tag imgbed-api:latest imgbed-api:backup || true

      - name: Build & Up
        run: sudo docker compose up -d --build

      - name: 健康检查
        run: |
          # 打 /healthz 而不是 /api/health：后者会连带查 HeatWave、
          # Ucenter JWKS 和 R2，CI 不该因为三个外部服务之一抖动就判失败。
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18080/healthz > /dev/null; then
              echo "healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          sudo docker compose logs --tail=50
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "部署失败，回滚旧镜像"
          sudo docker tag imgbed-api:backup imgbed-api:latest || true
          sudo docker compose up -d --no-build
