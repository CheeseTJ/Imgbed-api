name: Deploy

# push 到 main 自动构建并部署到本机（self-hosted runner 与服务同机）：
#   go test → docker compose build → up -d 重建容器 → 健康检查。
#
# 与 Remind-api / JMReader-api 的 deploy.yml 同一套模式，差别只有端口和
# 健康端点：
#   - 健康检查打 /healthz 而不是 /api/health：后者会连带查 DB、JWKS 和 R2，
#     部署后立刻打一次没问题，但没必要在 CI 里依赖三个外部服务都活着。
#   - 用 --force-recreate 而不是裸 up -d：docker-compose.yml 里的
#     healthcheck 改动不会让 compose 认为容器需要重建（它不参与配置哈希），
#     必须显式强制重建才能生效。
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# 同一时间只跑一个部署，避免两次 push 的 docker compose 互相打架。
concurrency:
  group: deploy-imgbed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # runner 的工作目录是复用的，保留 .git 能让增量拉取更快，
          # 也避免每次都重新 clone 整个仓库。
          clean: false

      - name: Go test
        run: go test ./... -count=1

      - name: Build & Up（docker compose）
        run: |
          sudo docker compose build
          sudo docker compose up -d --force-recreate

      - name: 健康检查
        run: |
          # 容器起来到 /healthz 可响应通常只要 1-2 秒，但首次启动要连
          # HeatWave，给 30 秒窗口轮询，避免偶发超时让部署假失败。
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed after 30s"
          sudo docker compose logs --tail=50
          exit 1

      - name: 镜像清理（只留最近两个）
        # 每次构建都会留下一个旧镜像，长期累积能吃掉几个 GB。
        if: always()
        run: |
          sudo docker image prune -f --filter "until=168h" || true
