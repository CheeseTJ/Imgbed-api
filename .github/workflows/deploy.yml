name: Deploy

# push 到 main 自动构建并部署到本机。
#
# 关键设计：**不用 runner 自己的工作目录**，而是直接更新真实部署目录
# /home/ubuntu/code/Imgbed/Imgbed-api。
#
# 为什么：
#   部署需要的三样东西都刻意不入库（.dockerignore 也排除）：
#     .env.docker   — 数据库密码等密钥（由 gen-docker-env.sh 生成）
#     .env.sh       — 上面那份的源头
#     config.yaml   — 真实配置
#   runner 默认在 _work/Imgbed-api/Imgbed-api 里 checkout，那里只有 git
#   里的文件，`docker compose up` 会直接报 env file not found（首次实测
#   正是这么失败的）。
#
#   把这些密钥塞进 GitHub Secrets 再还原是多此一举，还会让密钥多一份
#   复制品（泄露面变大）。既然 runner 和服务本来就同机，直接对真实目录
#   做 `git fetch && reset` 最干净：密钥原地不动，代码更新。
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# 同一时间只跑一个部署，避免两次 push 的 docker compose 互相打架。
concurrency:
  group: deploy-imgbed
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/ubuntu/code/Imgbed/Imgbed-api

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 更新代码（保留本地未入库文件）
        # reset --hard 只动 git 跟踪的文件；.env.docker / .env.sh /
        # config.yaml 不在版本控制里，所以密码和真实配置原地保留。
        run: |
          cd "$DEPLOY_DIR"
          git fetch --prune origin
          git reset --hard "origin/main"
          git --no-pager log --oneline -1

      - name: Go test
        run: |
          cd "$DEPLOY_DIR"
          go test ./... -count=1

      - name: 重新生成 .env.docker
        # 从 .env.sh 派生（compose 的 env_file 不执行 shell，读不了 .env.sh）。
        # 改了 .env.sh 后这里也会跟上。
        run: |
          cd "$DEPLOY_DIR"
          ./gen-docker-env.sh

      - name: Build & Up
        run: |
          cd "$DEPLOY_DIR"
          sudo docker compose build
          sudo docker compose up -d --force-recreate

      - name: 健康检查
        # 打 /healthz 而不是 /api/health：后者会连带查 HeatWave、
        # Ucenter JWKS 和 R2，CI 不该因为三个外部服务之一抖动就判失败。
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              echo "healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed after 30s"
          cd "$DEPLOY_DIR" && sudo docker compose logs --tail=50
          exit 1

      - name: 清理旧镜像
        # 每次构建留下一个旧镜像，长期能吃掉几个 GB。
        if: always()
        run: sudo docker image prune -f --filter "until=168h" || true
